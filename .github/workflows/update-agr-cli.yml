name: Update AGR CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Formal AGR CLI release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-agr-cli
  cancel-in-progress: false

env:
  BOTTLE_ROOT_URL: https://ghcr.io/v2/tencentcloudagentruntime/tap

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      already_published: ${{ steps.status.outputs.already_published }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Homebrew Tap app credentials
        env:
          APP_ID: ${{ vars.HOMEBREW_TAP_APP_ID }}
          PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" ]]; then
            echo "HOMEBREW_TAP_APP_ID is not configured" >&2
            exit 1
          fi
          if [[ -z "$PRIVATE_KEY" ]]; then
            echo "HOMEBREW_TAP_APP_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

      - name: Validate formal AGR CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be a formal release tag in vX.Y.Z format" >&2
            exit 1
          fi

          release="$(gh api repos/TencentCloudAgentRuntime/ags-cli/releases/tags/"$VERSION")"
          jq --exit-status --arg version "$VERSION" \
            '.tag_name == $version and .draft == false and .prerelease == false' \
            <<<"$release" >/dev/null

      - name: Detect an already published version
        id: status
        env:
          VERSION: ${{ inputs.version }}
        run: |
          formula_version="$(sed -nE 's/^  version "([^"]+)"/\1/p' Formula/agr-cli.rb)"
          if [[ "$formula_version" == "${VERSION#v}" ]] && grep -Fxq "  bottle do" Formula/agr-cli.rb; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  build-bottles:
    needs: prepare
    if: needs.prepare.outputs.already_published == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
          - os: macos-26
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Update Formula
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/update-agr-cli.sh "$VERSION"
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Check update scope
        run: |
          changed_files="$(git diff --name-only)"
          if [[ -n "${changed_files}" && "${changed_files}" != "Formula/agr-cli.rb" ]]; then
            echo "unexpected update scope: ${changed_files}" >&2
            exit 1
          fi
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - run: brew test-bot --only-cleanup-before
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - run: brew test-bot --only-setup
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - run: brew test-bot --only-tap-syntax
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - name: Build and test bottles
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}
        run: brew test-bot --only-formulae --keep-old --testing-formulae=agr-cli --root-url="$BOTTLE_ROOT_URL"
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Upload bottle artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: ${{ steps.set-up-homebrew.outputs.repository-path }}/*.bottle.*

  publish:
    needs:
      - prepare
      - build-bottles
    if: needs.prepare.outputs.already_published == 'false'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Create Homebrew Tap app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: TencentCloudAgentRuntime
          repositories: homebrew-tap
          permission-contents: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: publish-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: publish-rubygems-

      - name: Update Formula
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/update-agr-cli.sh "$VERSION"
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Download bottle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottles_*
          path: ${{ steps.set-up-homebrew.outputs.repository-path }}/bottles
          merge-multiple: true

      - name: Validate bottle artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/validate-bottle-artifacts.sh bottles "$VERSION" "$BOTTLE_ROOT_URL"
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Merge bottle metadata into Formula
        run: |
          cd bottles
          brew bottle --merge --write --no-commit \
            --root-url="$BOTTLE_ROOT_URL" ./*.bottle.json
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Validate publish scope
        run: |
          test "$(git diff --name-only)" = "Formula/agr-cli.rb"
          grep -Fxq "  bottle do" Formula/agr-cli.rb
          grep -Fq "root_url \"$BOTTLE_ROOT_URL\"" Formula/agr-cli.rb
          brew audit --strict TencentCloudAgentRuntime/tap/agr-cli
          brew test-bot --only-tap-syntax
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Commit Formula and bottle metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add Formula/agr-cli.rb
          git commit -m "chore: update agr-cli to ${VERSION}"
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Upload bottles to GitHub Packages
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
        run: |
          cd bottles
          brew pr-upload --upload-only --warn-on-upload-failure \
            --root-url="$BOTTLE_ROOT_URL"
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Verify bottles are publicly downloadable
        run: brew test-bot --only-bottles-fetch --testing-formulae=agr-cli
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Push Formula directly to main
        uses: Homebrew/actions/git-try-push@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          branch: main
