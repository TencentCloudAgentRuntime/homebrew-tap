name: Update AGR CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Formal AGR CLI release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-agr-cli
  cancel-in-progress: false

jobs:
  create-update-pr:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Homebrew Tap app credentials
        env:
          APP_ID: ${{ vars.HOMEBREW_TAP_APP_ID }}
          PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" ]]; then
            echo "HOMEBREW_TAP_APP_ID is not configured" >&2
            exit 1
          fi
          if [[ -z "$PRIVATE_KEY" ]]; then
            echo "HOMEBREW_TAP_APP_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

      - name: Create Homebrew Tap app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: TencentCloudAgentRuntime
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Formula
        run: scripts/update-agr-cli.sh "${{ inputs.version }}"

      - name: Check update scope
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(git diff --name-only)" = "Formula/agr-cli.rb"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up git
        if: steps.changes.outputs.changed == 'true'
        uses: Homebrew/actions/git-user-config@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Commit update
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          branch="update/agr-cli-${VERSION}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add Formula/agr-cli.rb
          git commit -m "chore: update agr-cli to ${VERSION}"
          echo "UPDATE_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Push update branch
        if: steps.changes.outputs.changed == 'true'
        uses: Homebrew/actions/git-try-push@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.UPDATE_BRANCH }}

      - name: Create update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "chore: update agr-cli to ${VERSION}" \
            --body "Automated Formula update for AGR CLI ${VERSION}. The pull request checks build and test Homebrew bottles for each supported platform. After review and successful checks, publish it with the \`brew pr-pull\` workflow using this pull request number and reviewed head SHA."
