name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04-arm
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Formula
        run: brew audit --strict TencentCloudAgentRuntime/tap/agr-cli

      - name: Install Formula
        run: brew install TencentCloudAgentRuntime/tap/agr-cli

      - name: Verify installed command
        run: |
          formula_version="$(brew info --json=v2 TencentCloudAgentRuntime/tap/agr-cli | ruby -rjson -e 'puts JSON.parse($stdin.read).fetch("formulae").first.fetch("versions").fetch("stable")')"
          agr version | grep -F "$formula_version"
          agr schema instance.create -o json | grep -F '"Name":"instance.create"'
          brew test TencentCloudAgentRuntime/tap/agr-cli

      - name: Uninstall Formula
        run: |
          bin_path="$(brew --prefix)/bin/agr"
          brew uninstall agr-cli
          test ! -e "$bin_path"
